<!doctype html>

<html lang="en" data-tab="home">
  <head>
    <meta charset="UTF-8" />
    <title>Burhanverse</title>
    <meta
      name="description"
      content="A clean portfolio designed by myself. Go check the source code at https://github.com/Burhanverse/Burhanverse.github.io"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="HandheldFriendly" content="true" />
    <link rel="icon" type="image/svg+xml" href="/favicon/mdlogo.svg" />
    <link rel="apple-touch-icon" href="/favicon/mdlogo.svg" />
    <meta name="msapplication-TileColor" content="#001F2A" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Preload critical background image for smooth tablet canvas -->
    <link rel="preload" as="image" href="/img/tabletWallpaper.webp" />

    <!-- Material Symbols Rounded Google Font & Local Fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link type="text/css" rel="stylesheet" href="/src/style/style.css" />
    <link type="text/css" rel="stylesheet" href="/src/style/fonts.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <noscript>
    <link rel="stylesheet" type="text/css" href="/noscript.css" />
    <div class="noscript-wrapper">
      <a
        class="noscript-avatar-wrapper"
        aria-label="Check my GitHub profile"
        href="https://github.com/Burhanverse"
      >
        <img
          alt="Github profile picture of Burhanverse"
          class="noscript-avatar"
          src="https://avatars.githubusercontent.com/Burhanverse"
        />
      </a>
      <div class="noscript-error-wrapper">
        <img
          alt="Warning icon"
          class="noscript-warning-img"
          src="/img/noScript.svg"
        />
        <div class="noscript-text-wrapper">
          <h1>Please activate Javascript</h1>
          <p>
            Here are some
            <a
              aria-label="Follow this link to learn more about activating JavaScript"
              href="https://enable-javascript.com"
              >instructions on how to enable JavaScript in your web browser</a
            >.
          </p>
        </div>
      </div>
    </div>
  </noscript>

  <body style="opacity: 0">
    <div class="cursor"></div>
    <div id="app"></div>
  </body>
</html>
